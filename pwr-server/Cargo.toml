[package]
name = "pwr-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../README.md"
description = "pwr daemon: runs on the NAS, handles project storage and retrieval over TLS"
documentation = "https://docs.rs/pwr-server"
keywords = ["archive", "backup", "server", "tls", "daemon"]
categories = ["network-programming"]

[lib]
name = "pwr_server"
path = "src/lib.rs"

[[bin]]
name = "pwr-server"
path = "src/main.rs"

[dependencies]
pwr-core = { version = "1.0.1", path = "../pwr-core" }
tokio.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
ring.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
log.workspace = true
dirs.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
