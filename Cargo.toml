[workspace]
resolver = "2"
members = ["pwr-core", "pwr-server", "pwr-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jacob/psync"
authors = ["Jacob Juneau <jacobjuneau6@gmail.com>"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "2"

# Core types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
dirs = "6"

# Async runtime
tokio = { version = "1", features = ["full"] }

# TLS and cryptography
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"
ring = "0.17"
sha2 = "0.10"
age = "0.11"

# Archive handling
tar = "0.4"
flate2 = "1"

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
console = "0.16"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
tempfile = "3"
